apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: first-pipeline
  annotations:
    scenarios.ai.sap.com/description: "Introduction to SAP AI Core"
    scenarios.ai.sap.com/name: "Tutorial"
    executables.ai.sap.com/description: "Greets the user"
    executables.ai.sap.com/name: "Hello Pipeline"
  labels:
    scenarios.ai.sap.com/id: "learning"
    ai.sap.com/version: "2.0"
spec:
  entrypoint: mypipeline
  templates:
  - name: mypipeline
    steps:
    - - name: greet
        template: greeter

  - name: greeter
    metadata:
      labels:
        ai.sap.com/resourcePlan: starter   # ← ADD THIS (fixes PENDING)
    container:
      image: docker.io/python:3.11-slim    # ← pinned slim image (~150MB vs ~1GB)
      imagePullPolicy: IfNotPresent        # ← don't re-pull on every run
      command:
        - python3
        - '-c'
      args:
        - |
          print("2nd attempt from pipeline")  # ← fixed indentation (2 spaces inside block)
